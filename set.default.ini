[app]
config_version=8

[browser]
home_url=https://chatgpt.com/
remote_debugging_port=0
language=zh-CN
accept_language=zh-CN,zh,en-US,en
disable_passkey_ui=1

[proxy]
enabled=0
type=socks5
host=127.0.0.1
port=1080
bypass_list=<local>;localhost;127.0.0.1
disable_quic=1

[ui]
theme=system

[tray]
close_to_tray=1
minimize_to_tray=1

[capture]
enabled=0
api_only=1
capture_all_text=1
url_contains=eastmoney.com/api/;
max_body_mb=4
max_queue_mb=32
include_sensitive_headers=0
directory=capture
skip_chatgpt=0

[market]
data_root=.

[schedule]
enabled=0
poll_seconds=5
response_timeout_seconds=30
lcpt_time=03:03
lalt_time=03:05
usdcnh_time=04:55
cum_time=15:03
alm_time=15:05

[email]
enabled=0
user=
password=
pop_host=pop.163.com
pop_port=995
smtp_host=smtp.163.com
smtp_port=465
all=
e=
allnum=13
