[app]
config_version=8

[browser]
home_url=https://chatgpt.com/
remote_debugging_port=0
; Chromium/CEF 原生界面语言
language=zh-CN
accept_language=zh-CN,zh,en-US,en
; 1=关闭用户名框里自动弹出的 Windows Hello / Passkey 条件式提示
; 不会关闭普通密码登录；改为 0 可恢复 Passkey 条件式 UI。
disable_passkey_ui=1

[proxy]
enabled=0
type=socks5
host=127.0.0.1
port=1080
bypass_list=<local>;localhost;127.0.0.1
disable_quic=1

[ui]
; system / light / dark
theme=system

[tray]
close_to_tray=1
minimize_to_tray=1

[capture]
; 默认关闭。只从托盘右键菜单切换，顶部没有按钮。
enabled=0
; 默认只抓 XHR/fetch/非 GET API，减少不必要的 ResponseFilter。
api_only=1
capture_all_text=1
url_contains=eastmoney.com/api/;
max_body_mb=4
max_queue_mb=32
include_sensitive_headers=0
directory=capture
; 如只想排除 ChatGPT/OpenAI 域名可改为 1。
skip_chatgpt=0

[market]
; 与旧版兼容：行情目录仍以 EXE 当前目录为根。
data_root=.

[schedule]
; ChatGPT 专用模式默认关闭；功能保留。
enabled=0
poll_seconds=5
response_timeout_seconds=30
lcpt_time=03:03
lalt_time=03:05
usdcnh_time=04:55
cum_time=15:03
alm_time=15:05

[email]
enabled=0
user=
password=
pop_host=pop.163.com
pop_port=995
smtp_host=smtp.163.com
smtp_port=465
all=
e=
allnum=13
